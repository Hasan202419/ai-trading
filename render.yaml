services:
  - type: web
    name: jarvis-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRADING_MODE
        value: paper
      - key: REQUIRE_MANUAL_APPROVAL
        value: "true"
      - key: ALPACA_API_KEY_ID
        sync: false
      - key: ALPACA_API_SECRET_KEY
        sync: false
      - key: ALPACA_DATA_BASE_URL
        value: https://data.alpaca.markets
      - key: ALPACA_DATA_FEED
        value: iex
      - key: ALPACA_DATA_DELAY_MINUTES
        value: "15"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: MARKET_DATA_PROVIDER
        value: auto
      - key: MARKET_DATA_PROVIDER_PRIORITY
        value: alpaca,yahoo,massive,finnhub
      - key: YAHOO_FINANCE_ENABLED
        value: "true"
      - key: YAHOO_FINANCE_BASE_URL
        value: https://query1.finance.yahoo.com
      - key: YAHOO_FINANCE_DATA_DELAY_MINUTES
        value: "15"
      - key: MASSIVE_API_KEY
        sync: false
      - key: MASSIVE_BASE_URL
        value: https://api.massive.com
      - key: MASSIVE_DATA_DELAY_MINUTES
        value: "15"
      - key: FINNHUB_API_KEY
        sync: false
      - key: FINNHUB_BASE_URL
        value: https://finnhub.io/api/v1
      - key: FINNHUB_DATA_DELAY_MINUTES
        value: "0"
      - key: FINVIZ_API_KEY
        sync: false
      - key: FINVIZ_BASE_URL
        sync: false

  - type: worker
    name: jarvis-worker
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRADING_MODE
        value: paper
      - key: REQUIRE_MANUAL_APPROVAL
        value: "true"
      - key: ALPACA_API_KEY_ID
        sync: false
      - key: ALPACA_API_SECRET_KEY
        sync: false
      - key: ALPACA_DATA_BASE_URL
        value: https://data.alpaca.markets
      - key: ALPACA_DATA_FEED
        value: iex
      - key: ALPACA_DATA_DELAY_MINUTES
        value: "15"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: MARKET_DATA_PROVIDER
        value: auto
      - key: MARKET_DATA_PROVIDER_PRIORITY
        value: alpaca,yahoo,massive,finnhub
      - key: YAHOO_FINANCE_ENABLED
        value: "true"
      - key: YAHOO_FINANCE_BASE_URL
        value: https://query1.finance.yahoo.com
      - key: YAHOO_FINANCE_DATA_DELAY_MINUTES
        value: "15"
      - key: MASSIVE_API_KEY
        sync: false
      - key: MASSIVE_BASE_URL
        value: https://api.massive.com
      - key: MASSIVE_DATA_DELAY_MINUTES
        value: "15"
      - key: FINNHUB_API_KEY
        sync: false
      - key: FINNHUB_BASE_URL
        value: https://finnhub.io/api/v1
      - key: FINNHUB_DATA_DELAY_MINUTES
        value: "0"
      - key: FINVIZ_API_KEY
        sync: false
      - key: FINVIZ_BASE_URL
        sync: false

  - type: web
    name: jarvis-mcp
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run mcp
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRADING_MODE
        value: paper
      - key: REQUIRE_MANUAL_APPROVAL
        value: "true"
      - key: ALPACA_API_KEY_ID
        sync: false
      - key: ALPACA_API_SECRET_KEY
        sync: false
      - key: ALPACA_DATA_BASE_URL
        value: https://data.alpaca.markets
      - key: ALPACA_DATA_FEED
        value: iex
      - key: ALPACA_DATA_DELAY_MINUTES
        value: "15"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: MARKET_DATA_PROVIDER
        value: auto
      - key: MARKET_DATA_PROVIDER_PRIORITY
        value: alpaca,yahoo,massive,finnhub
      - key: YAHOO_FINANCE_ENABLED
        value: "true"
      - key: YAHOO_FINANCE_BASE_URL
        value: https://query1.finance.yahoo.com
      - key: YAHOO_FINANCE_DATA_DELAY_MINUTES
        value: "15"
      - key: MASSIVE_API_KEY
        sync: false
      - key: MASSIVE_BASE_URL
        value: https://api.massive.com
      - key: MASSIVE_DATA_DELAY_MINUTES
        value: "15"
      - key: FINNHUB_API_KEY
        sync: false
      - key: FINNHUB_BASE_URL
        value: https://finnhub.io/api/v1
      - key: FINNHUB_DATA_DELAY_MINUTES
        value: "0"
      - key: FINVIZ_API_KEY
        sync: false
      - key: FINVIZ_BASE_URL
        sync: false

  - type: cron
    name: jarvis-research-cron
    runtime: node
    schedule: "0 21 * * 1-5"
    buildCommand: npm install
    startCommand: node src/worker/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRADING_MODE
        value: paper
